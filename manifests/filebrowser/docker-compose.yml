services:
  snbd-filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: snbd-filebrowser
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FB_PORT}:80"
    volumes:
      - /:/srv
      - snbd-filebrowser-db:/database

volumes:
  snbd-filebrowser-db:
    name: snbd-filebrowser-db
