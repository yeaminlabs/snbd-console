services:
  snbd-nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: snbd-nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "${NPM_HTTP_PORT}:80"
      - "${NPM_HTTPS_PORT}:443"
      - "127.0.0.1:${NPM_ADMIN_PORT}:81"
    volumes:
      - snbd-npm-data:/data
      - snbd-npm-letsencrypt:/etc/letsencrypt

volumes:
  snbd-npm-data:
    name: snbd-npm-data
  snbd-npm-letsencrypt:
    name: snbd-npm-letsencrypt
