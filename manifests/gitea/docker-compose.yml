services:
  snbd-gitea:
    image: gitea/gitea:latest
    container_name: snbd-gitea
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
    ports:
      - "${GITEA_HTTP_PORT}:3000"
      - "${GITEA_SSH_PORT}:22"
    volumes:
      - snbd-gitea-data:/data

volumes:
  snbd-gitea-data:
    name: snbd-gitea-data
