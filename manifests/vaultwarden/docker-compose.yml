services:
  snbd-vaultwarden:
    image: vaultwarden/server:latest
    container_name: snbd-vaultwarden
    restart: unless-stopped
    ports:
      - "127.0.0.1:${VW_PORT}:80"
    environment:
      - WEBSOCKET_ENABLED=true
      - SIGNUPS_ALLOWED=${VW_SIGNUPS}
    volumes:
      - snbd-vaultwarden-data:/data

volumes:
  snbd-vaultwarden-data:
    name: snbd-vaultwarden-data
