services:
  snbd-wordpress:
    image: wordpress:latest
    container_name: snbd-wordpress
    restart: unless-stopped
    depends_on:
      - snbd-wordpress-db
    ports:
      - "127.0.0.1:${WP_PORT}:80"
    environment:
      - WORDPRESS_DB_HOST=snbd-wordpress-db
      - WORDPRESS_DB_USER=wordpress
      - WORDPRESS_DB_PASSWORD=${MYSQL_PASSWORD}
      - WORDPRESS_DB_NAME=wordpress
    volumes:
      - snbd-wordpress-data:/var/www/html

  snbd-wordpress-db:
    image: mysql:8
    container_name: snbd-wordpress-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=wordpress
      - MYSQL_USER=wordpress
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - snbd-wordpress-db-data:/var/lib/mysql

volumes:
  snbd-wordpress-data:
    name: snbd-wordpress-data
  snbd-wordpress-db-data:
    name: snbd-wordpress-db-data
